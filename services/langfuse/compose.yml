services:
  langfuse-server:
    image: langfuse/langfuse:3.224.1
    ports:
      - "${LANGFUSE_PORT}:3000"
    environment:
      # Database
      - DATABASE_URL=postgres://postgres:${DATABASE_PASSWORD}@postgres:5432/postgres
      # Authentication & Security
      - NEXTAUTH_URL=http://host.docker.internal:${LANGFUSE_PORT}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - SALT=${SALT}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      # Redis
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_AUTH=${REDIS_PASSWORD}
      # Object storage settings for local self-hosted mode
      # These are kept as explicit placeholders because Langfuse validates them at startup,
      # but they do not require a MinIO service in this minimal compose stack.
      - LANGFUSE_S3_EVENT_UPLOAD_BUCKET=local
      - LANGFUSE_S3_EVENT_UPLOAD_REGION=auto
      - LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID=local
      - LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY=local
      - LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT=http://localhost:9000
      - LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE=true
      - LANGFUSE_S3_EVENT_UPLOAD_PREFIX=events/
      - LANGFUSE_S3_MEDIA_UPLOAD_BUCKET=local
      - LANGFUSE_S3_MEDIA_UPLOAD_REGION=auto
      - LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID=local
      - LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY=local
      - LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT=http://localhost:9000
      - LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE=true
      - LANGFUSE_S3_MEDIA_UPLOAD_PREFIX=media/
      # ClickHouse connection (Required for v3)
      - CLICKHOUSE_URL=http://clickhouse:8123
      - CLICKHOUSE_MIGRATION_URL=clickhouse://clickhouse:9000
      - CLICKHOUSE_USER=clickhouse
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD}
      - CLICKHOUSE_CLUSTER_ENABLED=false
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    networks:
      - backend
      - agentic-net
    restart: always

  postgres:
    image: postgres:16.14-alpine3.23
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${DATABASE_PASSWORD}
      - POSTGRES_DB=postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - backend
    restart: always

  redis:
    image: redis:7.4.10-alpine3.21
    command: redis-server --requirepass ${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 3s
    networks:
      - backend
    restart: always

  clickhouse:
    image: clickhouse/clickhouse-server:26.5.6.64-alpine
    environment:
      - CLICKHOUSE_DB=default
      - CLICKHOUSE_USER=clickhouse
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD}
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:8123/ping || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - backend
    restart: always

networks:
  backend:
    driver: bridge
  agentic-net:
    external: true
    name: agentic-net

volumes:
  postgres_data:
  clickhouse_data:
